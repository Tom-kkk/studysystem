name: DevSecOps CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  backend-sonar:
    name: Backend Build + SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: stu_backend/pom.xml

      - name: Validate SonarQube secrets
        run: |
          test -n "${{ secrets.SONAR_HOST_URL }}" || (echo "Missing SONAR_HOST_URL secret" && exit 1)
          test -n "${{ secrets.SONAR_TOKEN }}" || (echo "Missing SONAR_TOKEN secret" && exit 1)
          test -n "${{ secrets.SONAR_BACKEND_PROJECT_KEY }}" || (echo "Missing SONAR_BACKEND_PROJECT_KEY secret" && exit 1)

      - name: Build/Test/Scan backend
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_BACKEND_PROJECT_KEY }}
        run: |
          mvn -f stu_backend/pom.xml -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -Dsonar.projectName=stu_backend \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true

  frontend-sonar:
    name: Frontend Build + SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: stu_frontend
        run: npm ci

      - name: Build frontend
        working-directory: stu_frontend
        run: npm run build

      - name: SonarQube scan frontend
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: stu_frontend
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_FRONTEND_PROJECT_KEY }}
            -Dsonar.projectName=stu_frontend
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
            -Dsonar.qualitygate.wait=true

  zap-baseline:
    name: OWASP ZAP (session login)
    runs-on: ubuntu-latest
    needs: [backend-sonar, frontend-sonar]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ZAP scan secrets
        run: |
          test -n "${{ secrets.TARGET_BASE_URL }}" || (echo "Missing TARGET_BASE_URL" && exit 1)
          test -n "${{ secrets.ZAP_SCAN_USER }}" || (echo "Missing ZAP_SCAN_USER (DAST 专用测试账号)" && exit 1)
          test -n "${{ secrets.ZAP_SCAN_PASS }}" || (echo "Missing ZAP_SCAN_PASS" && exit 1)

      - name: Render ZAP Automation plan (JSON login + JSESSIONID)
        env:
          ZAP_TARGET_URL: ${{ secrets.TARGET_BASE_URL }}
          ZAP_SCAN_USER: ${{ secrets.ZAP_SCAN_USER }}
          ZAP_SCAN_PASS: ${{ secrets.ZAP_SCAN_PASS }}
        run: python3 .github/zap/render_zap_auth_plan.py

      - name: Run ZAP scan
        uses: zaproxy/action-af@v0.2.0
        with:
          # action-af 会挂载为 /zap/wrk/，故此处只能用仓库根目录下的相对路径
          plan: zap-plan-generated.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:stable

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html