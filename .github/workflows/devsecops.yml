name: DevSecOps CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  backend-sonar:
    name: Backend Build + SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build/Test/Scan backend
        run: |
          mvn -f stu_backend/pom.xml -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_BACKEND_PROJECT_KEY }} \
            -Dsonar.projectName=stu_backend \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true

  frontend-sonar:
    name: Frontend Build + SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: stu_frontend
        run: npm ci

      - name: Build frontend
        working-directory: stu_frontend
        run: npm run build

      - name: SonarQube scan frontend
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: stu_frontend
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_FRONTEND_PROJECT_KEY }}
            -Dsonar.projectName=stu_frontend
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
            -Dsonar.qualitygate.wait=true

  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: [backend-sonar, frontend-sonar]

    steps:
      - name: Run ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.TARGET_BASE_URL }}
          cmd_options: "-a -j -m 5"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html