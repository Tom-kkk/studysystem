spring.application.name=stu_backend

# 数据库配置：优先读取环境变量，可直接用于 docker compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/report?serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.mysql.cj=INFO

# 开发联调时可在默认错误页里看到异常信息（生产请按需关闭）
server.error.include-message=always
server.error.include-binding-errors=always

# 邮件配置：容器环境通过变量注入
spring.mail.host=${SPRING_MAIL_HOST:smtp.qq.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:true}

app.mail.from-display-name=${APP_MAIL_FROM_DISPLAY_NAME:实验报告系统}
app.mail.subject=${APP_MAIL_SUBJECT:实验报告系统验证码}
app.mail.deadline-reminder-hours=${APP_MAIL_DEADLINE_REMINDER_HOURS:24}
app.mail.deadline-reminder-cron=${APP_MAIL_DEADLINE_REMINDER_CRON:0 0/30 * * * ?}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
