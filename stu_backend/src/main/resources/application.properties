spring.application.name=stu_backend

# MySQL：库名与 sql/report.sql 一致（report）
# allowPublicKeyRetrieval：MySQL 8 常见 caching_sha2 认证时避免“Public Key Retrieval”连接失败
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/report?serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.mysql.cj=INFO

# 开发联调时可在默认错误页里看到异常信息（生产请按需关闭）
server.error.include-message=always
server.error.include-binding-errors=always

