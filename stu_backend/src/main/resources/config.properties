# 与教程 utils/config.properties 键名保持一致；Spring Boot 中亦可通过 application.yml 覆盖敏感项
# 数据源 JNDI 名（外置 Tomcat 场景）；Spring Boot 直连时可在 application 中配置 spring.datasource.*
data_source=java:comp/env/jdbc/Win_mysql_reportdb

# Windows 报告文件根目录（必须用 / 或写成 \\，勿用单反斜杠，否则 \U、\r 等会被 Properties 当转义）
Win_path=C:/Users/32145/Desktop/javarainy/studysystem/stu_backend/src/docs/report_system

# Linux 报告文件根目录
Linux_path=/usr/report_systemV1

# 日志文件子目录（位于上述根路径下）
logger_file=report_log

# 发件人账号（邮件）
from=

# 发件人邮箱授权码
password=

# SMTP 主机
smtpHost=smtp.126.com
